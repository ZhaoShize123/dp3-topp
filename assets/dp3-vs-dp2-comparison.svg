<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">DP3 vs DP2 selected-batch comparison</title>
  <desc id="desc">On 14 T12A paths, DP3 completes the batch in 194.35 seconds versus 196.00 seconds for DP2, with zero violations for both methods.</desc>
  <rect width="960" height="440" fill="#f8fafc"/>
  <rect x="24" y="24" width="912" height="392" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="56" y="72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">DP3 shortens executable trajectory time</text>
  <text x="56" y="101" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Selected T12A MuJoCo batch, 14 T12A paths, dense constraint audit</text>

  <text x="56" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#334155">Total trajectory time, lower is better</text>
  <line x1="212" y1="298" x2="840" y2="298" stroke="#cbd5e1" stroke-width="1"/>
  <text x="212" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">0 s</text>
  <text x="818" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">196 s</text>

  <text x="88" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f766e">DP3</text>
  <rect x="212" y="164" width="614.8" height="46" rx="6" fill="#0f766e"/>
  <rect x="212" y="164" width="614.8" height="46" rx="6" fill="url(#dp3Highlight)" opacity="0.18"/>
  <text x="628" y="193" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">DP3 total: 194.35 s</text>

  <text x="88" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#64748b">DP2</text>
  <rect x="212" y="234" width="620" height="46" rx="6" fill="#64748b"/>
  <text x="628" y="263" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">DP2 total: 196.00 s</text>

  <path d="M827 146 C859 130 878 128 894 142" fill="none" stroke="#d97706" stroke-width="3"/>
  <path d="M894 142 L882 139 L889 151 Z" fill="#d97706"/>
  <rect x="602" y="113" width="262" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="624" y="144" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9a3412">1.65 s faster (0.84%)</text>

  <rect x="56" y="338" width="244" height="54" rx="8" fill="#ecfeff" stroke="#99f6e4"/>
  <text x="78" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#134e4a">Feasibility</text>
  <text x="78" y="382" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">14/14 paths feasible</text>

  <rect x="326" y="338" width="244" height="54" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="348" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#166534">Constraint audit</text>
  <text x="348" y="382" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">0 violations for DP3 and DP2</text>

  <rect x="596" y="338" width="244" height="54" rx="8" fill="#fefce8" stroke="#fde68a"/>
  <text x="618" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#854d0e">Claim scope</text>
  <text x="618" y="382" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#0f172a">Same batch, lower runtime path</text>

  <text x="56" y="405" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Source: t12a-selected-batch-smoke comparison summary. CPU time is not used as the superiority claim.</text>

  <defs>
    <linearGradient id="dp3Highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
</svg>
